name: Refresh segment data

# Berkshire files four times a year, but the exact hour is unannounced, so we
# poll daily and only commit when the parsed output actually changes.
on:
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild from EDGAR
        run: python pipeline/build_segments.py 10

      - name: Commit if the data moved
        run: |
          git config user.name  "buffetts-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/data; then
            echo "No change."
            exit 0
          fi
          latest=$(python -c "import json;d=json.load(open('public/data/segments.json'));q=[p for p in d['periods'] if p['kind']=='Q'];print(q[-1]['end'])")
          git add public/data
          git commit -m "Refresh segment data through $latest"
          git push
